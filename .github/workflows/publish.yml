name: Publish APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified private build artifact
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          mkdir -p work/extracted
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o work/artifact.zip \
            https://api.github.com/repos/Patrick-9936/talestars-owned-rebuild/actions/artifacts/11676752262/zip
          unzip -q work/artifact.zip -d work/extracted
          apk_path="$(find work/extracted -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          mv "$apk_path" talestars-v11.apk
          echo '6bb5997267ca65d2b99b71ef86aeb674ba2bef39ee35c6b76ad9f4bb6f1e1f45  talestars-v11.apk' | sha256sum -c -

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v11-fix talestars-v11.apk \
            --repo Patrick-9936/talestars-v11 \
            --title 'TaleStars v11' \
            --notes 'TaleStars v11 Android APK. SHA-256: 6bb5997267ca65d2b99b71ef86aeb674ba2bef39ee35c6b76ad9f4bb6f1e1f45'
